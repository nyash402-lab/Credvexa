services:
  - type: web
    name: credvexa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "credvexa:app" --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MSG91_AUTH_TOKEN
        sync: false
      - key: MSG91_OTP_WIDGET_ID
        sync: false
      - key: MSG91_OTP_WIDGET_TOKEN_AUTH
        sync: false
      - key: MSG91_OTP_WIDGET_VERIFY_URL
        value: https://control.msg91.com/api/v5/widget/verifyAccessToken
      - key: CREDVEXA_STORAGE_BACKEND
        value: json