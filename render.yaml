services:
  - type: web
    name: credvexa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "credvexa:app" --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MSG91_AUTH_TOKEN
        sync: false
      - key: MSG91_API_BASE
        value: https://api.msg91.com/api/v5
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_COUNTRY_CODE
        value: "91"
      - key: MSG91_OTP_LENGTH
        value: "6"
      - key: MSG91_OTP_EXPIRY_MINUTES
        value: "10"
      - key: CREDVEXA_STORAGE_BACKEND
        value: json